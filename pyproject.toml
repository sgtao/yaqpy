[project]
name = "yaqpy"
version = "0.6.0"
description = "A pure-Python (stdlib only) implementation of the mikefarah/yq expression language"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.scripts]
yaqpy = "yaqpy.cli.main:main"
yaqpy-gui = "yaqpy.gui.app:cli_entry"

[project.optional-dependencies]
gui = [
    "flet>=1.0,<2",
]
web = [
    "flet[web]>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "python-toon>=0.1.3",
    "tzdata>=2026.4",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
# The test classes are named XxxTests (and a few TestXxx); helper base classes such as CliTestCase
# match neither, so they are not collected.
python_classes = ["Test*", "*Tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
timeout = 300
markers = [
    "golden: scenarios taken from the Go yq tests (tests/golden)",
    "acceptance: runs the CLI in a subprocess (tests/acceptance)",
    "gui: needs the optional Flet package",
    "slow: takes several seconds",
]

[tool.coverage.run]
source = ["yaqpy"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    '^\s*\.\.\.$',
]
